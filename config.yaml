# Portable defaults. Override this machine in ignored config.local.yaml.
assistant:
  name: Джарвис
  wake_word: джарвис
  wake_aliases: [джорвис, джервис]  # Common Whisper spellings
  language: ru

audio:
  sample_rate: 16000
  input_device: null
  energy_threshold: 0.015
  silence_timeout_sec: 0.8

stt:
  model_size: small
  device: cpu
  compute_type: int8
  beam_size: 3
  local_files_only: true

tts:
  engine: sapi  # Windows offline. Other systems: edge-tts (online) or console.
  sapi_voice: Irina
  voice: ru-RU-DmitryNeural
  rate: +10%
  volume: +0%

brain:
  provider: ollama  # none: only deterministic offline commands
  model: qwen2.5:7b-instruct
  base_url: http://127.0.0.1:11434/v1
  api_key: ollama
  timeout_sec: 60

skills:
  components:
    enabled: true
    storage_path: data/inventory.sqlite3
  system_tools:
    enabled: true
  smart_home:
    enabled: false
    ha_url: ""
    allowed_entities: []
  github_tools:
    enabled: false
    repo_path: .

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maker-assistant"
version = "0.1.0"
description = "100% Local, Always-On Voice AI Assistant for Hardware Engineers & Makers. GPU-accelerated, zero-cost, private."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DarkVolg" }
]
keywords = [
    "voice-assistant",
    "maker",
    "hardware-engineering",
    "faster-whisper",
    "cuda",
    "edge-tts",
    "home-assistant",
    "always-on"
]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "edge-tts>=6.1.12",
    "pygame>=2.5.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
maker-assistant = "main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maker-assistant"
version = "0.2.0"
description = "Voice workbench assistant with local speech, inventory and optional integrations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DarkVolg" }
]
keywords = [
    "voice-assistant",
    "maker",
    "hardware-engineering",
    "faster-whisper",
    "cuda",
    "edge-tts",
    "home-assistant",
    "always-on"
]
dependencies = [
    "faster-whisper==1.2.1",
    "av>=11,<17",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "edge-tts>=6.1.12",
    "pygame>=2.5.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
maker-assistant = "assistant.cli:app"

[tool.setuptools.packages.find]
include = ["assistant*"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
